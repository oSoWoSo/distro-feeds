name: Feeds

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    name: Build static feeds site
    steps:
      - name: Run Action
        uses: llun/feeds@4.0.6
        with:
          storageType: files
          #opmlFile: feeds.opml
          branch: public
          customDomain: feed.osowoso.org

      - name: Checkout public branch
        uses: actions/checkout@v6
        with:
          ref: public

      - name: Generate releases list
        run: |
          {
            echo "# Latest Distro Releases"
            echo ""
            echo "*Updated: $(date +%Y-%m-%d)*"
            echo ""
            curl -s https://distrowatch.com/ \
              | grep -o 'News">.*\.iso[^"]*' \
              | sed 's/.*">\([^<]*\)<\/a> &bull; <a href="\(http[^"]*\.iso[^"]*\).*/- [\1](\2)/'
          } > releases.md

      - name: Commit releases list
        run: |
          git config user.name "oSoWoSo-bot"
          git config user.email "mail@osowoso.org"
          git add releases.md
          git diff --staged --quiet || git commit -m "Update releases list [skip ci]"
          git push
