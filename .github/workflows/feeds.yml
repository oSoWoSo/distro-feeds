name: Feeds

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    name: Build static feeds site
    steps:
      - name: Run Action
        uses: llun/feeds@4.0.6
        env:
          NEXT_TELEMETRY_DISABLED: 1
        with:
          storageType: files
          #opmlFile: feeds.opml
          branch: public
          customDomain: feed.osowoso.org

      - name: Checkout public branch
        uses: actions/checkout@v6
        with:
          ref: public

      - name: Generate releases list
        run: |
          {
            cat << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Latest Distro Releases</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              a { color: #0070f3; }
              ul { line-height: 2; }
              .meta { color: #666; font-size: 0.9rem; }
              .back { display: inline-block; margin-bottom: 1.5rem; }
            </style>
          </head>
          <body>
            <a class="back" href="/">← Back</a>
            <h1>Latest Distro Releases</h1>
          EOF
            echo "  <p class=\"meta\">Updated: $(date +%Y-%m-%d)</p>"
            echo '  <ul>'
            curl -s https://distrowatch.com/ \
              | grep -o 'News">.*\.iso[^"]*' \
              | sed 's/.*">\([^<]*\)<\/a> &bull; <a href="\(http[^"]*\.iso[^"]*\).*/    <li><a href="\2">\1<\/a><\/li>/'
            cat << 'EOF'
            </ul>
          </body>
          </html>
          EOF
          } > releases.html

      - name: Commit releases list
        run: |
          git config user.name "oSoWoSo-bot"
          git config user.email "mail@osowoso.org"
          git add releases.html
          git diff --staged --quiet || git commit -m "Update releases list [skip ci]"
          git push
