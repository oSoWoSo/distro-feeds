# Optional homepage overrides for scripts/generate_releases.py
#
# Key   = DistroWatch slug (the last path segment of
#         https://distrowatch.com/<slug>, also the "href" in the release table)
# Value = homepage URL
#
# This file is only a fallback-free shortlist: every release already gets a
# homepage scraped from its DistroWatch page, so an entry here is only needed
# when that value is wrong or DistroWatch does not list one. Comments (#) and
# blank lines are ignored. Parsed as key=value - never sourced as shell.

alpinelinux=https://www.alpinelinux.org/
berserkarch=https://berserkarch.org/
bluestarlinux=https://sourceforge.net/projects/bluestarlinux/
chimo=https://chimoinc.webnode.page/
dharmalinux=http://dharmalinux.com.ar/
modiciaos=https://www.modiciaos.cloud/
nutyx=https://www.nutyx.org/
refreshos=https://refreshos.org/
solydxk=https://solydxk.com/
stratos=https://stratos-linux.org/
syslinux=https://syslinuxos.com/
taloslinux=https://www.talos.dev/
